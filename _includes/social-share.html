<section class="page__share">
  <h4 class="page__share-title">Share on</h4>

  <!-- X -->
  <a href="https://twitter.com/intent/tweet?text={{ page.title | url_encode }}%20{{ site.url | append: page.url | url_encode }}" class="btn btn--twitter" onclick="window.open(this.href, 'window', 'left=20,top=20,width=500,height=500,toolbar=1,resizable=0'); return false;" title="Share on X">
    <i class="fab fa-fw fa-twitter" aria-hidden="true"></i><span> X</span>
  </a>

  <!-- LinkedIn -->
  <a href="https://www.linkedin.com/shareArticle?mini=true&url={{ site.url | append: page.url | url_encode }}" class="btn btn--linkedin" onclick="window.open(this.href, 'window', 'left=20,top=20,width=500,height=500,toolbar=1,resizable=0'); return false;" title="Share on LinkedIn">
    <i class="fab fa-fw fa-linkedin" aria-hidden="true"></i><span> LinkedIn</span>
  </a>
  <!-- Facebook -->
  <a href="https://www.facebook.com/sharer/sharer.php?u={{ site.url | append: page.url | url_encode }}" class="btn btn--facebook" onclick="window.open(this.href, 'window', 'left=20,top=20,width=500,height=500,toolbar=1,resizable=0'); return false;" title="Share on Facebook">
    <i class="fab fa-fw fa-facebook" aria-hidden="true"></i><span> Facebook</span>
  </a>

  <!-- WhatsApp -->
  <a href="https://api.whatsapp.com/send?text={{ page.title | url_encode }}%20{{ site.url | append: page.url | url_encode }}" class="btn btn--whatsapp" onclick="window.open(this.href, 'window', 'left=20,top=20,width=500,height=500,toolbar=1,resizable=0'); return false;" title="Share on WhatsApp">
    <i class="fab fa-fw fa-whatsapp" aria-hidden="true"></i><span> WhatsApp</span>
  </a>
</section>
