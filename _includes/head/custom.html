<!-- Medium Zoom for Blog Images -->
<script src="https://cdn.jsdelivr.net/npm/medium-zoom@1.1.0/dist/medium-zoom.min.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    // Selects all images inside your blog posts
    mediumZoom('.page__content img', {
      margin: 24,
      background: '#000000e6' // Semi-transparent black background when zoomed
    });
  });
</script>
