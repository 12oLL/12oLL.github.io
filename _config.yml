# Site settings
title: 0marani
email: ""
description: >- 
  Personal security wiki, technical portfolio, and knowledge base. Documenting Red Teaming, Malware Analysis, and Purple Teaming research.
github_username: 12oLL
minimal_mistakes_skin: "dark"
search: true
url: "https://12oll.github.io"
baseurl: ""

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes

# Outputting
permalink: /:categories/:title/
paginate: 5 
paginate_path: /page:num/
timezone: 

include:
  - _pages

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-remote-theme
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

author:
  name: "Omarani"
  avatar: "/assets/images/pfp.jpeg"
  bio: "Security Enjoyer In All Aspects (Purple Teaming, Low Level, AI & More)"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/12oll"
    - label: "Linkedin"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/z7zzv/"
    - label: "Medium"
      icon: "fab fa-fw fa-medium-m"
      url: "https://medium.com/@omaraani"

footer:
  links:
   # Footer links currently commented out

# Consolidated Defaults Block
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: false
  # _wiki
  - scope:
      path: ""
      type: wiki
    values:
      layout: single
      author_profile: false
      classes: hacker-wiki
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

collections:
  wiki:
    output: true
    permalink: /wiki/:path/
  
og_image: "/assets/images/site-preview.jpg"